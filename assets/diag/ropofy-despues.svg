roke-width="2"></rect><text x="888" y="318" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">Un solo CTA</text><text x="888" y="348" fill="#767C99" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">por pantalla</text><line x1="180" y1="232" x2="180" y2="260" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ah)"></line><line x1="452" y1="232" x2="452" y2="260" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ah)"></line><line x1="724" y1="232" x2="724" y2="260" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ah)"></line><rect x="56" y="404" width="1088" height="116" rx="12" fill="#1B2240" stroke="#22D3EE" stroke-width="2"></rect><text x="80" y="452" fill="#22D3EE" font-size="24" font-weight="500" font-family="Inter, system-ui, sans-serif">Bandeja única · dueño y estado por consulta</text><text x="80" y="488" fill="#A2A8C2" font-size="19" font-weight="400" font-family="Inter, system-ui, sans-serif">Deja de importar por dónde entró la consulta: importa si ya se respondió.</text><line x1="600" y1="370" x2="600" y2="400" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ah)"></line><rect x="56" y="556" width="1088" height="82" rx="12" fill="none" stroke="#232A44" stroke-width="2" stroke-dasharray="7 7"></rect><text x="80" y="600" fill="#E9EBF4" font-size="22" font-weight="500" font-family="Inter, system-ui, sans-serif">Métrica del equipo: tiempo real de primera respuesta</text><text x="80" y="628" fill="#767C99" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">Acordada antes de rediseñar nada.</text>
