<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="El ciclo que se rompió">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22D3EE"></path></marker></defs>
<rect width="1200" height="700" fill="#0C1020"></rect>
<text x="56" y="58" fill="#22D3EE" font-size="17" font-weight="500" font-family="Inter, system-ui, sans-serif" letter-spacing="2.4">EL CICLO QUE SE ROMPIÓ</text>
<text x="56" y="122" fill="#F0466B" font-size="26" font-weight="500" font-family="Inter, system-ui, sans-serif">Antes: el conocimiento se quedaba con nosotros</text><rect x="56" y="160" width="248" height="120" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="78" y="212" fill="#E9EBF4" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Implementación</text><text x="78" y="246" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">configurada y</text><text x="78" y="272.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">entregada</text><rect x="336" y="160" width="248" height="120" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="358" y="212" fill="#E9EBF4" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Dudas</text><text x="358" y="246" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">semanas después</text><rect x="616" y="160" width="248" height="120" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="638" y="212" fill="#E9EBF4" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Sesión</text><text x="638" y="246" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">en vivo, otra vez</text><rect x="896" y="160" width="248" height="120" rx="12" fill="#141A2E" stroke="#F0466B" stroke-width="2"></rect><text x="918" y="212" fill="#F0466B" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Dependencia</text><text x="918" y="246" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">del equipo consultor</text><line x1="312" y1="220" x2="328" y2="220" stroke="#F0466B" stroke-width="2.5" marker-end="url(#ah)"></line><line x1="592" y1="220" x2="608" y2="220" stroke="#F0466B" stroke-width="2.5" marker-end="url(#ah)"></line><line x1="872" y1="220" x2="888" y2="220" stroke="#F0466B" stroke-width="2.5" marker-end="url(#ah)"></line><path d="M 1020 292 C 1020 350 560 350 180 350 L 180 292" fill="none" stroke="#F0466B" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#ah)"></path><text x="600" y="376" fill="#767C99" font-size="19" font-weight="400" font-family="Inter, system-ui, sans-serif" text-anchor="middle">el ciclo se repetía dentro del mismo cliente</text><text x="56" y="458" fill="#22D3EE" font-size="26" font-weight="500" font-family="Inter, system-ui, sans-serif">Después: documentación como producto</text><rect x="56" y="496" width="248" height="120" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="78" y="548" fill="#E9EBF4" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Implementación</text><text x="78" y="582" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">configurada y</text><text x="78" y="608.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">entregada</text><rect x="336" y="496" width="248" height="120" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="358" y="548" fill="#E9EBF4" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Material</text><text x="358" y="582" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">producido una vez</text><rect x="616" y="496" width="248" height="120" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="638" y="548" fill="#E9EBF4" font-size="21" font-weight="500" font-family="Inter, system-ui, sans-serif">El equipo del cliente</text><text x="638" y="582" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">resuelve solo</text><rect x="896" y="496" width="248" height="120" rx="12" fill="#1B2240" stroke="#22D3EE" stroke-width="2"></rect><text x="918" y="548" fill="#22D3EE" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Autonomía</text><text x="918" y="582" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">menos horas de</text><text x="918" y="608.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">aclaración</text><line x1="312" y1="556" x2="328" y2="556" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ah)"></line><line x1="592" y1="556" x2="608" y2="556" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ah)"></line><line x1="872" y1="556" x2="888" y2="556" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ah)"></line>
<text x="1144" y="666" fill="#767C99" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif" text-anchor="end">Esquema propio · sin datos de cliente (NDA)</text>
</svg>