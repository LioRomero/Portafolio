<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Detalle de un oferente">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22D3EE"></path></marker></defs>
<rect width="1200" height="700" fill="#0C1020"></rect>
<text x="56" y="58" fill="#22D3EE" font-size="17" font-weight="500" font-family="Inter, system-ui, sans-serif" letter-spacing="2.4">DETALLE DE UN OFERENTE</text>
<rect x="56" y="104" width="660" height="542" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><rect x="80" y="128" width="300" height="40" rx="8" fill="#1B2240" stroke="#232A44" stroke-width="2"></rect><text x="92" y="156" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">Oferente seleccionado</text><rect x="80" y="192" width="612" height="64" rx="8" fill="#1B2240" stroke="#232A44" stroke-width="2"></rect><text x="100" y="232" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">Monto ofertado</text><rect x="80" y="272" width="612" height="64" rx="8" fill="#1B2240" stroke="#232A44" stroke-width="2"></rect><text x="100" y="312" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">Productos incluidos</text><rect x="80" y="352" width="612" height="64" rx="8" fill="#1B2240" stroke="#232A44" stroke-width="2"></rect><text x="100" y="392" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">Requisitos cumplidos</text><rect x="80" y="440" width="612" height="182" rx="12" fill="#1B2240" stroke="#22D3EE" stroke-width="2"></rect><text x="104" y="484" fill="#22D3EE" font-size="17" font-weight="500" font-family="Inter, system-ui, sans-serif" letter-spacing="2.4">DOCUMENTO FUENTE</text><text x="104" y="522" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">Un clic más abajo: el PDF original, para citar</text><text x="104" y="552.45" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">la fuente en la sustentación.</text><rect x="748" y="104" width="396" height="542" rx="12" fill="none" stroke="#232A44" stroke-width="2" stroke-dasharray="7 7"></rect><text x="772" y="152" fill="#8B7BF0" font-size="17" font-weight="500" font-family="Inter, system-ui, sans-serif" letter-spacing="2.4">POR QUÉ ASÍ</text><text x="772" y="196" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">Nadie leía los PDF</text><text x="772" y="226.45" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">completos: comparaban de</text><text x="772" y="256.9" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">memoria entre pestañas. La</text><text x="772" y="287.35" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">decisión ocurría fuera del</text><text x="772" y="317.8" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">sistema. El detalle deja de</text><text x="772" y="348.25" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">ser el punto de partida y</text><text x="772" y="378.7" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">pasa a ser el respaldo.</text>
<text x="1144" y="666" fill="#767C99" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif" text-anchor="end">Wireframe propio · datos ilustrativos, no reales</text>
</svg>