<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @keyframes inFade { from { opacity:0 } to { opacity:1 } }
  @keyframes inRise { from { opacity:0; transform:translate3d(0,14px,0) } to { opacity:1; transform:none } }
  @keyframes inOut { 0% { opacity:0; transform:translate3d(0,10px,0) } 18% { opacity:1; transform:none } 82% { opacity:1; transform:none } 100% { opacity:0; transform:translate3d(0,-10px,0) } }
  @keyframes inPulse { 0%,100% { transform:scale(1); opacity:.55 } 50% { transform:scale(1.5); opacity:1 } }
  @keyframes inLine { from { transform:scaleX(0) } to { transform:scaleX(1) } }
  @keyframes inHalo { 0% { transform:scale(.6); opacity:0 } 40% { opacity:.9 } 100% { transform:scale(1.25); opacity:0 } }
  @keyframes inWipe { 0% { transform:translate3d(-101%,0,0) } 46% { transform:none } 100% { transform:translate3d(101%,0,0) } }
  @keyframes inRush { 0% { opacity:0; transform:scale(1.5) } 30% { opacity:1; transform:scale(1) } 72% { opacity:1; transform:scale(1) } 100% { opacity:0; transform:scale(.9) } }
  @keyframes inVeil { 0%,72% { opacity:1 } 100% { opacity:0 } }
</style>
</helmet>

<sc-if value="{{ showing }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ skip }}" style="{{ veilStyle }}">

    <sc-if value="{{ isLong }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;width:640px;height:640px;border-radius:999px;pointer-events:none;background:radial-gradient(circle, color-mix(in srgb,#8B7BF0 20%,transparent) 0%, transparent 66%);animation:inHalo 5s ease-out both"></div>
      <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;padding:0 32px">
        <span style="width:9px;height:9px;border-radius:999px;background:#22D3EE;box-shadow:0 0 18px #22D3EE;animation:inPulse 1.6s ease-in-out infinite,inFade .5s ease both"></span>
        <div style="font-size:11.5px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:#22D3EE;margin-top:22px;animation:inRise .8s ease .3s both">{{ c.kicker }}</div>
        <div style="font-size:15px;letter-spacing:0.24em;text-transform:uppercase;color:#E9EBF4;margin-top:12px;animation:inRise .8s ease .6s both">Emilio Romero</div>
        <span style="width:120px;height:1px;background:#3A4468;margin-top:22px;transform-origin:center;animation:inLine .9s cubic-bezier(.2,.7,.3,1) 1s both"></span>
        <h1 style="font-weight:300;font-size:46px;line-height:1.16;letter-spacing:-0.035em;color:#E9EBF4;margin:26px 0 0;max-width:760px;text-wrap:pretty;animation:inRise 1s ease 1.35s both">{{ c.lineA }}<br>{{ c.lineB }}</h1>
        <div style="display:flex;gap:26px;margin-top:34px;flex-wrap:wrap;justify-content:center">
          <sc-for list="{{ beats }}" as="b" hint-placeholder-count="3">
            <span style="{{ b.style }}">{{ b.word }}</span>
          </sc-for>
        </div>
        <p style="font-size:15px;line-height:1.6;color:#A2A8C2;font-weight:300;margin:30px 0 0;max-width:520px;text-wrap:pretty;animation:inRise 1s ease 3.5s both">{{ c.close }}</p>
      </div>
    </sc-if>

    <sc-if value="{{ isShort }}" hint-placeholder-val="{{ false }}">
      <div style="{{ wipeStyle }}"></div>
      <div style="position:relative;text-align:center;padding:0 32px;animation:inRush 1.7s cubic-bezier(.2,.8,.25,1) both">
        <div style="font-size:11.5px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:{{ c.hue }}">{{ c.kicker }}</div>
        <div style="font-weight:400;font-size:42px;line-height:1.12;letter-spacing:-0.035em;color:#E9EBF4;margin-top:14px;text-wrap:pretty">{{ c.lineA }}</div>
      </div>
    </sc-if>

    <button onClick="{{ skip }}" style="{{ skipStyle }}">{{ c.skip }}</button>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:760},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;casos&quot;,&quot;sobre&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;es&quot;,&quot;en&quot;],&quot;default&quot;:&quot;es&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const C = {
  home: {
    es: {
      kicker: "Bogotá · Remoto global",
      lineA: "Antes de la pantalla,", lineB: "hay alguien pensando.",
      words: ["Escucho.", "Diseño.", "Mido."],
      close: "Este portafolio se puede leer en diez minutos o explorar durante media hora. Tú eliges cuál.",
      skip: "Saltar intro"
    },
    en: {
      kicker: "Bogotá · Remote worldwide",
      lineA: "Before the screen,", lineB: "there's someone thinking.",
      words: ["I listen.", "I design.", "I measure."],
      close: "You can read this portfolio in ten minutes or explore it for half an hour. Your call.",
      skip: "Skip intro"
    }
  },
  casos: {
    es: { kicker: "Entrando al proyecto", lineA: "Tres casos, tres problemas que nadie sabía enunciar.", hue: "#22D3EE", skip: "Saltar" },
    en: { kicker: "Entering the project", lineA: "Three cases, three problems nobody could name.", hue: "#22D3EE", skip: "Skip" }
  },
  sobre: {
    es: { kicker: "Entrando", lineA: "La persona detrás de los casos.", hue: "#F0466B", skip: "Saltar" },
    en: { kicker: "Entering", lineA: "The person behind the cases.", hue: "#F0466B", skip: "Skip" }
  }
};

const HUE = ["#22D3EE", "#8B7BF0", "#F0466B"];

class Component extends DCLogic {
  state = { showing: true };

  componentDidMount() {
    const long = (this.props.variant || "home") === "home";
    this._ms = long ? 5400 : 1900;
    this._t = setTimeout(() => this.skip(), this._ms);
    this._key = () => this.skip();
    window.addEventListener("keydown", this._key);
    document.documentElement.style.overflow = "hidden";
  }

  componentWillUnmount() { this.release(); }

  release() {
    clearTimeout(this._t);
    window.removeEventListener("keydown", this._key);
    document.documentElement.style.overflow = "";
  }

  skip() {
    if (!this.state.showing) return;
    this.release();
    this.setState({ showing: false });
  }

  renderVals() {
    const variant = this.props.variant || "home";
    const lang = this.props.lang === "en" ? "en" : "es";
    const c = (C[variant] || C.home)[lang];
    const long = variant === "home";
    const dur = long ? "5.4s" : "1.9s";

    return {
      c, showing: this.state.showing, isLong: long, isShort: !long,
      skip: () => this.skip(),
      veilStyle: "position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#080B16;cursor:pointer;font-family:Inter,system-ui,sans-serif;animation:inVeil " + dur + " ease both",
      wipeStyle: "position:absolute;inset:0;background:linear-gradient(100deg, color-mix(in srgb," + (c.hue || "#22D3EE") + " 18%,#080B16) 0%, #080B16 62%);animation:inWipe 1.9s cubic-bezier(.65,0,.35,1) both",
      skipStyle: "position:absolute;right:26px;bottom:24px;padding:8px 16px;border-radius:999px;border:1px solid #232A44;background:#0C1020;color:#767C99;font-size:12.5px;font-family:inherit;cursor:pointer;animation:inFade .6s ease " + (long ? "1.6s" : "0.5s") + " both",
      beats: (c.words || []).map((word, i) => ({
        word,
        style: "font-size:19px;font-weight:400;letter-spacing:-0.01em;color:" + HUE[i % 3] + ";animation:inOut 1.5s ease " + (2.1 + i * 0.42).toFixed(2) + "s both"
      }))
    };
  }
}
</script>
</body>
</html>
