<text x="56" y="118" fill="#22D3EE" font-size="26" font-weight="500" font-family="Inter, system-ui, sans-serif">Two levels, one primary action per screen.</text><rect x="56" y="170" width="1088" height="84" rx="12" fill="#1B2240" stroke="#22D3EE" stroke-width="2"></rect><text x="80" y="220" fill="#E9EBF4" font-size="22" font-weight="500" font-family="Inter, system-ui, sans-serif">Level 1 · domain</text><text x="400" y="220" fill="#A2A8C2" font-size="19" font-weight="400" font-family="Inter, system-ui, sans-serif">4 destinations</text><rect x="56" y="280" width="300" height="306" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="80" y="330" fill="#E9EBF4" font-size="21" font-weight="500" font-family="Inter, system-ui, sans-serif">Level 2 · section</text><rect x="80" y="358" width="252" height="40" rx="6" fill="#1B2240" stroke="#22D3EE" stroke-width="2"></rect><rect x="80" y="410" width="252" height="40" rx="6" fill="#1B2240" stroke="#232A44" stroke-width="2"></rect><rect x="80" y="462" width="252" height="40" rx="6" fill="#1B2240" stroke="#232A44" stroke-width="2"></rect><rect x="388" y="280" width="756" height="306" rx="12" fill="#141A2E" stroke="#22D3EE" stroke-width="2"></rect><text x="412" y="334" fill="#E9EBF4" font-size="22" font-weight="500" font-family="Inter, system-ui, sans-serif">Content</text><rect x="412" y="366" width="712" height="96" rx="10" fill="#1B2240" stroke="#22D3EE" stroke-width="2"></rect><text x="436" y="414" fill="#22D3EE" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">One primary action</text><text x="436" y="444" fill="#A2A8C2" font-size="19" font-weight="400" font-family="Inter, system-ui, sans-serif">everything else drops to secondary or goes</text><text x="412" y="506" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">Visual base first (spacing and colour), then the</text><text x="412" y="535" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">structure, and only then the components.</text><rect x="56" y="614" width="1088" height="44" rx="12" fill="none" stroke="#232A44" stroke-width="2" stroke-dasharray="7 7"></rect><text x="80" y="644" fill="#767C99" font-size="19" font-weight="400" font-family="Inter, system-ui, sans-serif">Phased refactor: from the system towards the components</text>
