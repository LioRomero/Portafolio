<text x="56" y="58" fill="#22D3EE" font-size="17" font-weight="500" font-family="Inter, system-ui, sans-serif" letter-spacing="2.4">THE CYCLE THAT BROKE</text>
<text x="56" y="122" fill="#F0466B" font-size="26" font-weight="500" font-family="Inter, system-ui, sans-serif">Before: the knowledge stayed with us</text><rect x="56" y="160" width="248" height="120" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="78" y="212" fill="#E9EBF4" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Rollout</text><text x="78" y="246" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">configured and</text><text x="78" y="272.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">handed over</text><rect x="336" y="160" width="248" height="120" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="358" y="212" fill="#E9EBF4" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Questions</text><text x="358" y="246" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">weeks later</text><rect x="616" y="160" width="248" height="120" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="638" y="212" fill="#E9EBF4" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Session</text><text x="638" y="246" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">live, all over again</text><rect x="896" y="160" width="248" height="120" rx="12" fill="#141A2E" stroke="#F0466B" stroke-width="2"></rect><text x="918" y="212" fill="#F0466B" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Dependency</text><text x="918" y="246" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">on the consultants</text><line x1="312" y1="220" x2="328" y2="220" stroke="#F0466B" stroke-width="2.5" marker-end="url(#ah)"></line><line x1="592" y1="220" x2="608" y2="220" stroke="#F0466B" stroke-width="2.5" marker-end="url(#ah)"></line><line x1="872" y1="220" x2="888" y2="220" stroke="#F0466B" stroke-width="2.5" marker-end="url(#ah)"></line><path d="M 1020 292 C 1020 350 560 350 180 350 L 180 292" fill="none" stroke="#F0466B" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#ah)"></path><text x="600" y="376" fill="#767C99" font-size="19" font-weight="400" font-family="Inter, system-ui, sans-serif" text-anchor="middle">the cycle repeated inside the same client</text><text x="56" y="458" fill="#22D3EE" font-size="26" font-weight="500" font-family="Inter, system-ui, sans-serif">After: documentation as a product</text><rect x="56" y="496" width="248" height="120" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="78" y="548" fill="#E9EBF4" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Rollout</text><text x="78" y="582" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">configured and</text><text x="78" y="608.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">handed over</text><rect x="336" y="496" width="248" height="120" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="358" y="548" fill="#E9EBF4" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Material</text><text x="358" y="582" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">produced once</text><rect x="616" y="496" width="248" height="120" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="638" y="548" fill="#E9EBF4" font-size="21" font-weight="500" font-family="Inter, system-ui, sans-serif">The client team</text><text x="638" y="582" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">sorts it out alone</text><rect x="896" y="496" width="248" height="120" rx="12" fill="#1B2240" stroke="#22D3EE" stroke-width="2"></rect><text x="918" y="548" fill="#22D3EE" font-size="23" font-weight="500" font-family="Inter, system-ui, sans-serif">Autonomy</text><text x="918" y="582" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">fewer hours</text><text x="918" y="608.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">clarifying</text><line x1="312" y1="556" x2="328" y2="556" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ah)"></line><line x1="592" y1="556" x2="608" y2="556" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ah)"></line><line x1="872" y1="556" x2="888" y2="556" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ah)"></line>
