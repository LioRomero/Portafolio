<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="From published document to decision">
<rect width="1200" height="700" fill="#0C1020"/>
<text x="56" y="58" fill="#22D3EE" font-size="17" font-weight="500" font-family="Inter, system-ui, sans-serif" letter-spacing="2.4">FROM PUBLISHED DOCUMENT TO DECISION</text>
<rect x="56" y="230" width="188" height="188" rx="12" fill="#141A2E" stroke="#8B7BF0" stroke-width="2"/><circle cx="86" cy="262" r="15" fill="#8B7BF0" opacity="0.18"/><text x="86" y="268" fill="#8B7BF0" font-size="16" font-weight="600" font-family="Inter, system-ui, sans-serif" text-anchor="middle">1</text><text x="76" y="320" fill="#E9EBF4" font-size="20" font-weight="500" font-family="Inter, system-ui, sans-serif">Documents</text><text x="76" y="354" fill="#A2A8C2" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif">from the tender,</text><text x="76" y="378" fill="#A2A8C2" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif">as published</text><path d="M 252 324 L 270 324" stroke="#767C99" stroke-width="2"/><path d="M 264 318 L 272 324 L 264 330 z" fill="#767C99"/><rect x="278" y="230" width="188" height="188" rx="12" fill="#141A2E" stroke="#8B7BF0" stroke-width="2"/><circle cx="308" cy="262" r="15" fill="#8B7BF0" opacity="0.18"/><text x="308" y="268" fill="#8B7BF0" font-size="16" font-weight="600" font-family="Inter, system-ui, sans-serif" text-anchor="middle">2</text><text x="298" y="320" fill="#E9EBF4" font-size="20" font-weight="500" font-family="Inter, system-ui, sans-serif">Digitisation</text><text x="298" y="354" fill="#A2A8C2" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif">Power BI + AI</text><text x="298" y="378" fill="#A2A8C2" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif">turn them into data</text><path d="M 474 324 L 492 324" stroke="#767C99" stroke-width="2"/><path d="M 486 318 L 494 324 L 486 330 z" fill="#767C99"/><rect x="500" y="230" width="188" height="188" rx="12" fill="#141A2E" stroke="#22D3EE" stroke-width="2"/><circle cx="530" cy="262" r="15" fill="#22D3EE" opacity="0.18"/><text x="530" y="268" fill="#22D3EE" font-size="16" font-weight="600" font-family="Inter, system-ui, sans-serif" text-anchor="middle">3</text><text x="520" y="320" fill="#E9EBF4" font-size="20" font-weight="500" font-family="Inter, system-ui, sans-serif">Comparison</text><text x="520" y="354" fill="#A2A8C2" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif">requested</text><text x="520" y="378" fill="#A2A8C2" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif">vs. offered</text><path d="M 696 324 L 714 324" stroke="#767C99" stroke-width="2"/><path d="M 708 318 L 716 324 L 708 330 z" fill="#767C99"/><rect x="722" y="230" width="188" height="188" rx="12" fill="#141A2E" stroke="#f0466b" stroke-width="2"/><circle cx="752" cy="262" r="15" fill="#f0466b" opacity="0.18"/><text x="752" y="268" fill="#f0466b" font-size="16" font-weight="600" font-family="Inter, system-ui, sans-serif" text-anchor="middle">4</text><text x="742" y="320" fill="#E9EBF4" font-size="20" font-weight="500" font-family="Inter, system-ui, sans-serif">Inconsistency</text><text x="742" y="354" fill="#A2A8C2" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif">price, missing</text><text x="742" y="378" fill="#A2A8C2" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif">data or product</text><path d="M 918 324 L 936 324" stroke="#767C99" stroke-width="2"/><path d="M 930 318 L 938 324 L 930 330 z" fill="#767C99"/><rect x="944" y="230" width="188" height="188" rx="12" fill="#141A2E" stroke="#22D3EE" stroke-width="2"/><circle cx="974" cy="262" r="15" fill="#22D3EE" opacity="0.18"/><text x="974" y="268" fill="#22D3EE" font-size="16" font-weight="600" font-family="Inter, system-ui, sans-serif" text-anchor="middle">5</text><text x="964" y="320" fill="#E9EBF4" font-size="20" font-weight="500" font-family="Inter, system-ui, sans-serif">Decision</text><text x="964" y="354" fill="#A2A8C2" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif">the signature</text><text x="964" y="378" fill="#A2A8C2" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif">stays human</text><rect x="56" y="462" width="1088" height="86" rx="10" fill="#1B2240" stroke="#232A44" stroke-width="2"/>
<text x="80" y="498" fill="#E9EBF4" font-size="19" font-weight="500" font-family="Inter, system-ui, sans-serif">What changes the work: step 4 is the tool's job.</text>
<text x="80" y="528" fill="#A2A8C2" font-size="17" font-weight="400" font-family="Inter, system-ui, sans-serif">Before, finding the inconsistency meant reading whole documents, one by one.</text>
<text x="80" y="632" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">The tool points at where to look. Awarding stays human, and so auditable.</text>
<text x="1144" y="666" fill="#767C99" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif" text-anchor="end">My own diagram · IDB TechSprint 2024</text>
</svg>