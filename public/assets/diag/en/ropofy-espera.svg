<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="The finding · the wait">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F0466B"></path></marker></defs>
<rect width="1200" height="700" fill="#0C1020"></rect>
<text x="56" y="58" fill="#F0466B" font-size="17" font-weight="500" font-family="Inter, system-ui, sans-serif" letter-spacing="2.4">THE FINDING · THE WAIT</text>
<text x="56" y="124" fill="#E9EBF4" font-size="30" font-weight="500" font-family="Inter, system-ui, sans-serif">“I wrote on Friday and they replied on Tuesday.</text><text x="56" y="166" fill="#E9EBF4" font-size="30" font-weight="500" font-family="Inter, system-ui, sans-serif">I had already bought elsewhere.”</text><line x1="56" y1="300" x2="1144" y2="300" stroke="#232A44" stroke-width="2"></line><circle cx="74" cy="300" r="9" fill="#22D3EE"></circle><text x="56" y="262" fill="#22D3EE" font-size="21" font-weight="500" font-family="Inter, system-ui, sans-serif">Friday</text><text x="56" y="340" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">In comes</text><text x="56" y="366.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">the enquiry</text><circle cx="308" cy="300" r="9" fill="#767C99"></circle><text x="290" y="262" fill="#767C99" font-size="21" font-weight="500" font-family="Inter, system-ui, sans-serif">Saturday</text><text x="290" y="340" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">Silence</text><circle cx="542" cy="300" r="9" fill="#F0466B"></circle><text x="524" y="262" fill="#F0466B" font-size="21" font-weight="500" font-family="Inter, system-ui, sans-serif">Sunday</text><text x="524" y="340" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">Buys somewhere</text><text x="524" y="366.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">else</text><circle cx="776" cy="300" r="9" fill="#767C99"></circle><text x="758" y="262" fill="#767C99" font-size="21" font-weight="500" font-family="Inter, system-ui, sans-serif">Monday</text><text x="758" y="340" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">Still</text><text x="758" y="366.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">silence</text><circle cx="1010" cy="300" r="9" fill="#767C99"></circle><text x="992" y="262" fill="#767C99" font-size="21" font-weight="500" font-family="Inter, system-ui, sans-serif">Tuesday</text><text x="992" y="340" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">In comes</text><text x="992" y="366.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">the reply</text><rect x="56" y="430" width="520" height="200" rx="12" fill="none" stroke="#F0466B" stroke-width="2"></rect><text x="80" y="474" fill="#F0466B" font-size="17" font-weight="500" font-family="Inter, system-ui, sans-serif" letter-spacing="2.4">WHAT THE CUSTOMER READS</text><text x="80" y="514" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">Silence reads as indifference.</text><text x="80" y="544.45" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">The decision is already made</text><text x="80" y="574.9" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">before you reply.</text><rect x="624" y="430" width="520" height="200" rx="12" fill="#141A2E" stroke="#22D3EE" stroke-width="2"></rect><text x="648" y="474" fill="#22D3EE" font-size="17" font-weight="500" font-family="Inter, system-ui, sans-serif" letter-spacing="2.4">WHAT I DID WITH IT</text><text x="648" y="514" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">Measure the real response time per</text><text x="648" y="544.45" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">channel and rebuild the flow around</text><text x="648" y="574.9" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">contact, not the catalogue.</text>
<text x="1144" y="666" fill="#767C99" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif" text-anchor="end">My own diagram · based on customer interviews</text>
</svg>