<text x="56" y="124" fill="#E9EBF4" font-size="26" font-weight="500" font-family="Inter, system-ui, sans-serif">Buscar, comparar y sustentar: el recorrido completo de una</text><text x="56" y="161.7" fill="#E9EBF4" font-size="26" font-weight="500" font-family="Inter, system-ui, sans-serif">decisión auditable.</text><rect x="56" y="220" width="320" height="240" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="84" y="278" fill="#22D3EE" font-size="19" font-weight="500" font-family="Inter, system-ui, sans-serif">01</text><text x="84" y="326" fill="#E9EBF4" font-size="27" font-weight="500" font-family="Inter, system-ui, sans-serif">Buscar</text><text x="84" y="368" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">Filtros por entidad,</text><text x="84" y="397" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">monto y fecha.</text><rect x="440" y="220" width="320" height="240" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="468" y="278" fill="#22D3EE" font-size="19" font-weight="500" font-family="Inter, system-ui, sans-serif">02</text><text x="468" y="326" fill="#E9EBF4" font-size="27" font-weight="500" font-family="Inter, system-ui, sans-serif">Comparar</text><text x="468" y="368" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">Oferentes lado a lado en</text><text x="468" y="397" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">una sola vista.</text><rect x="824" y="220" width="320" height="240" rx="12" fill="#141A2E" stroke="#232A44" stroke-width="2"></rect><text x="852" y="278" fill="#22D3EE" font-size="19" font-weight="500" font-family="Inter, system-ui, sans-serif">03</text><text x="852" y="326" fill="#E9EBF4" font-size="27" font-weight="500" font-family="Inter, system-ui, sans-serif">Sustentar</text><text x="852" y="368" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">La fuente citable dentro</text><text x="852" y="397" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">del mismo flujo.</text><line x1="384" y1="340" x2="432" y2="340" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ah)"></line><line x1="768" y1="340" x2="816" y2="340" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#ah)"></line><rect x="56" y="516" width="1088" height="120" rx="12" fill="#1B2240" stroke="#8B7BF0" stroke-width="2"></rect><text x="80" y="562" fill="#8B7BF0" font-size="17" font-weight="500" font-family="Inter, system-ui, sans-serif" letter-spacing="2.4">RESULTADO</text><text x="80" y="602" fill="#E9EBF4" font-size="22" font-weight="400" font-family="Inter, system-ui, sans-serif">2.º lugar del TechSprint del BID, con mención por democratización de</text><text x="80" y="633.9" fill="#E9EBF4" font-size="22" font-weight="400" font-family="Inter, system-ui, sans-serif">datos.</text>
