<text x="80" y="498" fill="#E9EBF4" font-size="19" font-weight="500" font-family="Inter, system-ui, sans-serif">Lo que cambia el trabajo: el paso 4 lo hace la herramienta.</text>
<text x="80" y="528" fill="#A2A8C2" font-size="17" font-weight="400" font-family="Inter, system-ui, sans-serif">Antes, encontrar la inconsistencia era leer los documentos completos, uno por uno.</text>
<text x="80" y="632" fill="#A2A8C2" font-size="20" font-weight="400" font-family="Inter, system-ui, sans-serif">La herramienta señala dónde mirar. Adjudicar sigue siendo humano, y por eso auditable.</text>
