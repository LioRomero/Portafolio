<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="El hallazgo · la espera">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F0466B"></path></marker></defs>
<rect width="1200" height="700" fill="#0C1020"></rect>
<text x="56" y="58" fill="#F0466B" font-size="17" font-weight="500" font-family="Inter, system-ui, sans-serif" letter-spacing="2.4">EL HALLAZGO · LA ESPERA</text>
<text x="56" y="124" fill="#E9EBF4" font-size="30" font-weight="500" font-family="Inter, system-ui, sans-serif">“Escribí el viernes y me contestaron el martes.</text><text x="56" y="166" fill="#E9EBF4" font-size="30" font-weight="500" font-family="Inter, system-ui, sans-serif">Ya había comprado en otro lado.”</text><line x1="56" y1="300" x2="1144" y2="300" stroke="#232A44" stroke-width="2"></line><circle cx="74" cy="300" r="9" fill="#22D3EE"></circle><text x="56" y="262" fill="#22D3EE" font-size="21" font-weight="500" font-family="Inter, system-ui, sans-serif">Viernes</text><text x="56" y="340" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">Llega la</text><text x="56" y="366.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">consulta</text><circle cx="308" cy="300" r="9" fill="#767C99"></circle><text x="290" y="262" fill="#767C99" font-size="21" font-weight="500" font-family="Inter, system-ui, sans-serif">Sábado</text><text x="290" y="340" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">Silencio</text><circle cx="542" cy="300" r="9" fill="#F0466B"></circle><text x="524" y="262" fill="#F0466B" font-size="21" font-weight="500" font-family="Inter, system-ui, sans-serif">Domingo</text><text x="524" y="340" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">Compra en otro</text><text x="524" y="366.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">lado</text><circle cx="776" cy="300" r="9" fill="#767C99"></circle><text x="758" y="262" fill="#767C99" font-size="21" font-weight="500" font-family="Inter, system-ui, sans-serif">Lunes</text><text x="758" y="340" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">Sigue el</text><text x="758" y="366.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">silencio</text><circle cx="1010" cy="300" r="9" fill="#767C99"></circle><text x="992" y="262" fill="#767C99" font-size="21" font-weight="500" font-family="Inter, system-ui, sans-serif">Martes</text><text x="992" y="340" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">Llega la</text><text x="992" y="366.1" fill="#A2A8C2" font-size="18" font-weight="400" font-family="Inter, system-ui, sans-serif">respuesta</text><rect x="56" y="430" width="520" height="200" rx="12" fill="none" stroke="#F0466B" stroke-width="2"></rect><text x="80" y="474" fill="#F0466B" font-size="17" font-weight="500" font-family="Inter, system-ui, sans-serif" letter-spacing="2.4">LO QUE EL CLIENTE LEE</text><text x="80" y="514" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">El silencio se interpreta como</text><text x="80" y="544.45" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">desinterés. La decisión ya se tomó</text><text x="80" y="574.9" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">antes de que respondas.</text><rect x="624" y="430" width="520" height="200" rx="12" fill="#141A2E" stroke="#22D3EE" stroke-width="2"></rect><text x="648" y="474" fill="#22D3EE" font-size="17" font-weight="500" font-family="Inter, system-ui, sans-serif" letter-spacing="2.4">LO QUE HICE CON ESO</text><text x="648" y="514" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">Medir el tiempo real de respuesta por</text><text x="648" y="544.45" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">canal y rediseñar el flujo alrededor</text><text x="648" y="574.9" fill="#A2A8C2" font-size="21" font-weight="400" font-family="Inter, system-ui, sans-serif">del contacto, no del catálogo.</text>
<text x="1144" y="666" fill="#767C99" font-size="16" font-weight="400" font-family="Inter, system-ui, sans-serif" text-anchor="end">Esquema propio · basado en entrevistas a clientes</text>
</svg>